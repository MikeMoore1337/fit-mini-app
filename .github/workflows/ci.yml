name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitminiapp_test
          POSTGRES_USER: fitminiapp
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitminiapp -d fitminiapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.artifacts/cache/npm
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PRE_COMMIT_HOME: ${{ github.workspace }}/.artifacts/cache/pre-commit
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            bot/requirements.txt

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r bot/requirements.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify generated API types
        working-directory: frontend
        run: |
          npm run api:types
          git diff --exit-code -- src/shared/api/schema.d.ts

      - name: Frontend checks and production build
        working-directory: frontend
        run: npm run check

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend smoke tests
        working-directory: frontend
        run: npm run e2e

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements-runtime.txt
          pip-audit -r bot/requirements.txt

      - name: Alembic migrations
        working-directory: backend
        run: alembic upgrade head
        env:
          APP_ENV: test
          APP_NAME: FitMiniApp CI
          APP_HOST: 127.0.0.1
          APP_PORT: "8000"
          APP_DEBUG: "false"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS: "30"
          DATABASE_URL: postgresql+psycopg://fitminiapp:test-password@127.0.0.1:5432/fitminiapp_test
          ENABLE_DEV_AUTH: "true"
          TELEGRAM_BOT_TOKEN: test-token
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters

      - name: Pytest on PostgreSQL
        run: python scripts/run_pytest.py backend/tests bot/tests tests/integration -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fitminiapp:test-password@127.0.0.1:5432/fitminiapp_test
          ENABLE_DEV_AUTH: "true"
          TELEGRAM_BOT_TOKEN: test-token
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters
