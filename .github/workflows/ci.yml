name: CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.artifacts/runtime/cache/npm
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/runtime/cache/uv
  UV_SYSTEM_PYTHON: "1"

jobs:
  task-provenance:
    name: Task provenance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate task PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/task_session.py validate-pr --event "$GITHUB_EVENT_PATH"

  merge-provenance:
    name: Merged master provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact merged task PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/task_session.py verify-master-merge --sha "$GITHUB_SHA"

  quality:
    name: Python quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRE_COMMIT_HOME: ${{ github.workspace }}/.artifacts/runtime/cache/pre-commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.1
      - name: Run shared quality group
        run: python scripts/ci_contract.py run-group quality

  policy:
    name: Delivery policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            bot/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: policy
      - name: Install Python dependencies
        run: uv pip install -r backend/requirements.txt -r bot/requirements.txt
      - name: Run shared delivery policy group
        run: python scripts/ci_contract.py run-group policy

  frontend:
    name: Frontend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/requirements-runtime.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install API schema dependencies
        run: uv pip install -r backend/requirements-runtime.txt
      - name: Run shared frontend checks group
        run: python scripts/ci_contract.py run-group frontend-checks

  frontend-smoke:
    name: Frontend smoke
    needs: frontend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend preview
        working-directory: frontend
        run: npm run build
      - name: Run shared frontend E2E group
        run: python scripts/ci_contract.py run-group frontend-e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: .artifacts/runtime/tests/playwright
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  python-tests:
    name: Python tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitminiapp_test
          POSTGRES_USER: fitminiapp
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitminiapp -d fitminiapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            bot/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: python-tests
      - name: Install Python dependencies
        run: uv pip install -r backend/requirements.txt -r bot/requirements.txt
      - name: Run shared Python tests group
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fitminiapp:test-password@127.0.0.1:5432/fitminiapp_test
          ENABLE_DEV_AUTH: "true"
          TELEGRAM_BOT_TOKEN: test-token
          BOT_INTERNAL_TOKEN: test-bot-internal-token
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters
        run: python scripts/ci_contract.py run-group python-tests

  migrated-stack:
    name: Migrated PostgreSQL stack
    needs: frontend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitminiapp_test
          POSTGRES_USER: fitminiapp
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitminiapp -d fitminiapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: migrated-stack
      - name: Install stack dependencies
        run: |
          uv pip install -r backend/requirements.txt
          npm --prefix frontend ci
      - name: Build frontend preview
        working-directory: frontend
        run: npm run build
      - name: Run shared migrated-stack group
        env:
          RUN_MIGRATED_STACK_TEST: "1"
          APP_ENV: test
          APP_NAME: Your Fitness Coach CI
          APP_DEBUG: "false"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS: "30"
          DATABASE_URL: postgresql+psycopg://fitminiapp:test-password@127.0.0.1:5432/fitminiapp_test
          ENABLE_DEV_AUTH: "true"
          TELEGRAM_BOT_TOKEN: test-token
          BOT_INTERNAL_TOKEN: test-bot-internal-token
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters
        run: python scripts/ci_contract.py run-group migrated-stack

  dependency-audit:
    name: Dependency audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements-runtime.txt
            bot/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: dependency-audit
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run shared dependency audit group
        run: python scripts/ci_contract.py run-group dependency-audit

  containers:
    name: Container (${{ matrix.image }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, bot]
    steps:
      - uses: actions/checkout@v4
      - name: Run shared container contract group
        run: python scripts/ci_contract.py run-group container-contract
      - uses: docker/setup-buildx-action@v4
      - name: Resolve immutable image reference
        id: image
        env:
          IMAGE_KIND: ${{ matrix.image }}
        run: python scripts/deployment_contract.py refs --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --kind "$IMAGE_KIND" >> "$GITHUB_OUTPUT"
      - name: Build and scan production image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image == 'backend' && '.' || 'bot' }}
          file: ${{ matrix.image == 'backend' && 'backend/Dockerfile' || 'bot/Dockerfile' }}
          load: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.image.outputs.local_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.73.0
          image-ref: ${{ steps.image.outputs.local_tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - name: Publish immutable image after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          LOCAL_TAG: ${{ steps.image.outputs.local_tag }}
          PUBLISHED_REF: ${{ steps.image.outputs.image_ref }}
        run: docker tag "$LOCAL_TAG" "$PUBLISHED_REF" && docker push "$PUBLISHED_REF"

  checks:
    name: ${{ github.event_name == 'pull_request' && 'checks' || 'branch-checks' }}
    if: always()
    needs:
      [task-provenance, merge-provenance, quality, policy, frontend, frontend-smoke, python-tests, migrated-stack, dependency-audit, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required result set
        env:
          EVENT_NAME: ${{ github.event_name }}
          TASK_PROVENANCE_RESULT: ${{ needs.task-provenance.result }}
          MERGE_PROVENANCE_RESULT: ${{ needs.merge-provenance.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_SMOKE_RESULT: ${{ needs.frontend-smoke.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
          MIGRATED_STACK_RESULT: ${{ needs.migrated-stack.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$TASK_PROVENANCE_RESULT" = success
            test "$QUALITY_RESULT" = success
            test "$POLICY_RESULT" = success
            test "$FRONTEND_RESULT" = success
            test "$FRONTEND_SMOKE_RESULT" = success
            test "$PYTHON_TESTS_RESULT" = success
            test "$MIGRATED_STACK_RESULT" = success
            test "$DEPENDENCY_AUDIT_RESULT" = success
            test "$CONTAINERS_RESULT" = success
          else
            test "$MERGE_PROVENANCE_RESULT" = success
            test "$CONTAINERS_RESULT" = success
          fi
