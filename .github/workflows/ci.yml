name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  # Keep first attempts grouped by ref so newer pushes cancel stale work. A
  # manually re-run older workflow must not cancel the current branch run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_attempt == 1 && 'latest' || github.run_id }}
  cancel-in-progress: true

env:
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.artifacts/cache/npm
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/cache/uv
  UV_SYSTEM_PYTHON: "1"

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRE_COMMIT_HOME: ${{ github.workspace }}/.artifacts/cache/pre-commit

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.1

      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for API schema generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/requirements-runtime.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: frontend

      - name: Install API schema dependencies
        run: uv pip install -r backend/requirements-runtime.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify generated API types
        working-directory: frontend
        run: |
          npm run api:types
          git diff --exit-code -- src/shared/api/schema.d.ts

      - name: Frontend checks
        shell: bash
        working-directory: frontend
        run: |
          set -uo pipefail
          npm run typecheck & typecheck_pid=$!
          npm run lint & lint_pid=$!
          npm run format:check & format_pid=$!
          npm run test & test_pid=$!

          status=0
          wait "$typecheck_pid" || status=1
          wait "$lint_pid" || status=1
          wait "$format_pid" || status=1
          wait "$test_pid" || status=1
          exit "$status"

      - name: Build frontend for production
        working-directory: frontend
        run: npx vite build

      - name: Upload frontend production build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  frontend-smoke:
    name: Frontend smoke
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download frontend production build
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend smoke tests
        working-directory: frontend
        run: npm run e2e:ci

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: .artifacts/tests/playwright
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitminiapp_test
          POSTGRES_USER: fitminiapp
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitminiapp -d fitminiapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            bot/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: python-tests

      - name: Install dependencies
        run: uv pip install -r backend/requirements.txt -r bot/requirements.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Pytest on PostgreSQL
        run: python scripts/run_pytest.py backend/tests bot/tests -q -n 4 --dist=worksteal --durations=20
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fitminiapp:test-password@127.0.0.1:5432/fitminiapp_test
          ENABLE_DEV_AUTH: "true"
          TELEGRAM_BOT_TOKEN: test-token
          BOT_INTERNAL_TOKEN: test-bot-internal-token
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters

  migrated-stack:
    name: Migrated PostgreSQL stack
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitminiapp_test
          POSTGRES_USER: fitminiapp
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitminiapp -d fitminiapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend production build
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: migrated-stack

      - name: Install dependencies
        run: uv pip install -r backend/requirements.txt

      - name: Install frontend browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Dependency consistency
        run: python -m pip check

      - name: Alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
        env:
          APP_ENV: test
          APP_NAME: Your Fitness Coach CI
          APP_DEBUG: "false"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS: "30"
          DATABASE_URL: postgresql+psycopg://fitminiapp:test-password@127.0.0.1:5432/fitminiapp_test
          ENABLE_DEV_AUTH: "true"
          TELEGRAM_BOT_TOKEN: test-token
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters

      - name: Migrated PostgreSQL API and account-deletion smoke
        run: python scripts/run_pytest.py tests/integration/test_migrated_stack.py -q
        env:
          RUN_MIGRATED_STACK_TEST: "1"
          APP_ENV: test
          APP_NAME: Your Fitness Coach CI
          APP_DEBUG: "false"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS: "30"
          DATABASE_URL: postgresql+psycopg://fitminiapp:test-password@127.0.0.1:5432/fitminiapp_test
          ENABLE_DEV_AUTH: "true"
          TELEGRAM_BOT_TOKEN: test-token
          BOT_INTERNAL_TOKEN: test-bot-internal-token
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters

      - name: Migrated PostgreSQL real browser smoke
        working-directory: frontend
        run: npm run e2e:migrated-stack
        env:
          APP_ENV: test
          APP_NAME: Your Fitness Coach CI
          APP_DEBUG: "false"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS: "30"
          DATABASE_URL: postgresql+psycopg://fitminiapp:test-password@127.0.0.1:5432/fitminiapp_test
          ENABLE_DEV_AUTH: "true"
          TELEGRAM_BOT_TOKEN: test-token
          BOT_INTERNAL_TOKEN: test-bot-internal-token
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters

      - name: Upload migrated-stack traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: migrated-stack-playwright-failure-${{ github.run_id }}
          path: .artifacts/tests/playwright-migrated-stack
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements-runtime.txt
            bot/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: dependency-audit

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Python dependency vulnerability audit
        run: |
          uvx --from pip-audit==2.10.1 pip-audit -r backend/requirements-runtime.txt
          uvx --from pip-audit==2.10.1 pip-audit -r bot/requirements.txt

  containers:
    name: Container (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
            tag: fit-mini-app-backend:ci
          - image: bot
            context: bot
            dockerfile: bot/Dockerfile
            tag: fit-mini-app-bot:ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # v0.36.0 is an immutable, signed post-remediation release. Keep the full SHA.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.73.0
          image-ref: ${{ matrix.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          IMAGE_KIND: ${{ matrix.image }}
          LOCAL_TAG: ${{ matrix.tag }}
        run: |
          registry_tag="ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_KIND}:${GITHUB_SHA}"
          docker tag "$LOCAL_TAG" "$registry_tag"
          docker push "$registry_tag"

  checks:
    name: checks
    if: always()
    needs:
      [
        quality,
        frontend,
        frontend-smoke,
        python-tests,
        migrated-stack,
        dependency-audit,
        containers,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all CI jobs succeeded
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_SMOKE_RESULT: ${{ needs.frontend-smoke.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
          MIGRATED_STACK_RESULT: ${{ needs.migrated-stack.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$FRONTEND_SMOKE_RESULT" = success
          test "$PYTHON_TESTS_RESULT" = success
          test "$MIGRATED_STACK_RESULT" = success
          test "$DEPENDENCY_AUDIT_RESULT" = success
          test "$CONTAINERS_RESULT" = success
