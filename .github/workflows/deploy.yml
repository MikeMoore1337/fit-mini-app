name: Release production

on:
  # A merged pull request is the only production release entry point. The successful post-merge
  # CI run deploys that exact master SHA automatically, without a separate human approval.
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

permissions:
  contents: read

# The protected pull-request merge is the release authorization. A deployment must never be
# cancelled halfway through by a newer merge.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Verify merged pull request provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          PR_NUMBERS="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$REPOSITORY/commits/$DEPLOY_SHA/pulls" \
            --jq ".[] | select(.merged_at != null and .base.ref == \"master\" and .merge_commit_sha == \"$DEPLOY_SHA\") | .number")"
          if [ -z "$PR_NUMBERS" ]; then
            echo "Refusing production deployment: $DEPLOY_SHA is not the merge result of a pull request into master" >&2
            exit 1
          fi
          echo "Authorized production revision $DEPLOY_SHA from pull request(s): $PR_NUMBERS"

  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PROD_HOST: app.your-fitness-coach.ru
      PROD_PORT: "22"
      PROD_USER: root
      PROD_PATH: /root/fit-mini-app
      PROD_URL: https://app.your-fitness-coach.ru
      PROD_PUBLIC_URL: https://your-fitness-coach.ru
      PROD_ROLLOUT_MODE: single-slot
      GHCR_BACKEND_IMAGE: ghcr.io/mikemoore1337/fit-mini-app-backend
      GHCR_BOT_IMAGE: ghcr.io/mikemoore1337/fit-mini-app-bot

    steps:
      - name: Configure production SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested revision
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GHCR_TOKEN"
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "set -Eeuo pipefail
             IFS= read -r GHCR_TOKEN
             DOCKER_CONFIG_DIR=\$(mktemp -d)
             trap 'rm -rf \"\$DOCKER_CONFIG_DIR\"' EXIT
             export DOCKER_CONFIG=\"\$DOCKER_CONFIG_DIR\"
             registry_login_succeeded=false
             for attempt in 1 2 3 4 5; do
               if printf '%s' \"\$GHCR_TOKEN\" | docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null; then
                 registry_login_succeeded=true
                 break
               fi
               if [ \"\$attempt\" -eq 5 ]; then
                 break
               fi
               delay=\$((attempt * 10))
               echo \"GHCR login attempt \$attempt failed; retrying in \$delay seconds\" >&2
               sleep \"\$delay\"
             done
             if [ \"\$registry_login_succeeded\" != true ]; then
               echo \"GHCR login failed after 5 attempts\" >&2
               exit 1
             fi
             cd '$PROD_PATH'
             git fetch --prune origin master
             LATEST_MASTER_SHA=\$(git rev-parse origin/master)
             if [ \"\$LATEST_MASTER_SHA\" != '$DEPLOY_SHA' ]; then
               echo \"Skipping superseded deployment: tested revision $DEPLOY_SHA is no longer master head (\$LATEST_MASTER_SHA)\"
               exit 0
             fi
             git reset --hard '$DEPLOY_SHA'
             DEPLOY_SINGLE_SLOT_CONFIRMED_SHA='$DEPLOY_SHA' \
             BACKEND_IMAGE='$GHCR_BACKEND_IMAGE:$DEPLOY_SHA' \
             BOT_IMAGE='$GHCR_BOT_IMAGE:$DEPLOY_SHA' \
             bash scripts/deploy_production.sh \
               '$DEPLOY_SHA' \
               '$PROD_URL' \
               '$PROD_PUBLIC_URL' \
               '$PROD_ROLLOUT_MODE'"

  sync-dev:
    name: Sync deployed master to dev
    needs: deploy
    if: >-
      needs.deploy.result == 'success' &&
      vars.ENABLE_DEPLOYED_MASTER_DEV_SYNC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: production
      deployment: false

    steps:
      - name: Create narrowly scoped sync token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.DEV_SYNC_APP_ID }}
          private-key: ${{ secrets.DEV_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out exact deployed master revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fast-forward dev to exact deployed master
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin master dev
          master_sha="$(git rev-parse refs/remotes/origin/master)"
          dev_sha="$(git rev-parse refs/remotes/origin/dev)"
          if [ "$master_sha" != "$DEPLOY_SHA" ]; then
            echo "Refusing sync: deployed SHA $DEPLOY_SHA is no longer current master $master_sha" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$dev_sha" "$DEPLOY_SHA"; then
            echo "Refusing sync: dev $dev_sha is not an ancestor of deployed master $DEPLOY_SHA" >&2
            exit 1
          fi
          if [ "$dev_sha" = "$DEPLOY_SHA" ]; then
            echo "dev already equals deployed master $DEPLOY_SHA"
            exit 0
          fi
          git push origin "$DEPLOY_SHA:refs/heads/dev"
