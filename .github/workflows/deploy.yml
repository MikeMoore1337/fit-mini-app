name: Deploy production

on:
  # Intentional continuous deployment: every successful CI run caused by a push/force-push to
  # master deploys that exact SHA. Owner approval and the verified pre-deploy backup branch are
  # required before changing remote master, including history-only or documentation-only changes.
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Authorization happens before pushing master. A deployment must never be cancelled halfway
# through by a newer push.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PROD_HOST: app.your-fitness-coach.ru
      PROD_PORT: "22"
      PROD_USER: root
      PROD_PATH: /root/fit-mini-app
      PROD_URL: https://app.your-fitness-coach.ru
      GHCR_BACKEND_IMAGE: ghcr.io/mikemoore1337/fit-mini-app-backend
      GHCR_BOT_IMAGE: ghcr.io/mikemoore1337/fit-mini-app-bot

    steps:
      - name: Configure production SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested revision
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GHCR_TOKEN"
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "set -Eeuo pipefail
             IFS= read -r GHCR_TOKEN
             DOCKER_CONFIG_DIR=\$(mktemp -d)
             trap 'rm -rf \"\$DOCKER_CONFIG_DIR\"' EXIT
             export DOCKER_CONFIG=\"\$DOCKER_CONFIG_DIR\"
             printf '%s' \"\$GHCR_TOKEN\" | docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null
             cd '$PROD_PATH' &&
             git fetch --prune origin master &&
             git reset --hard '$DEPLOY_SHA' &&
             BACKEND_IMAGE='$GHCR_BACKEND_IMAGE:$DEPLOY_SHA' \
             BOT_IMAGE='$GHCR_BOT_IMAGE:$DEPLOY_SHA' \
             bash scripts/deploy_production.sh '$DEPLOY_SHA' '$PROD_URL'"
