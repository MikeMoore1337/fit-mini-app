x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-fit-mini-app-backend:local}
  build:
    context: .
    dockerfile: backend/Dockerfile

x-bot-image: &bot-image
  image: ${BOT_IMAGE:-fit-mini-app-bot:local}
  build: ./bot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    <<: *backend-image
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FORWARDED_ALLOW_IPS: 172.29.0.3
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)\"",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
      start_interval: 2s
    networks:
      default:
      app_edge:
        ipv4_address: 172.29.0.2

  setup:
    <<: *backend-image
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: /app/setup-entrypoint.sh

  bot:
    <<: *bot-image
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://app.your-fitness-coach.ru}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN}
      BOT_POLLING_ENABLED: ${BOT_POLLING_ENABLED:-true}
      BOT_POLLING_LOCK_DIR: /var/lock/fitminiapp-bot
      BOT_CONFLICT_RETRY_SECONDS: ${BOT_CONFLICT_RETRY_SECONDS:-300}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - bot_polling_lock:/var/lock/fitminiapp-bot

  support-bot:
    <<: *bot-image
    restart: unless-stopped
    command: ["python", "-m", "fitminiapp_bot.support_bot"]
    environment:
      SUPPORT_BOT_TOKEN: ${SUPPORT_BOT_TOKEN:-}
      SUPPORT_ADMIN_TELEGRAM_USER_IDS: ${SUPPORT_ADMIN_TELEGRAM_USER_IDS:-}
      SUPPORT_BOT_ENABLED: ${SUPPORT_BOT_ENABLED:-false}

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./deploy/Caddyfile.edge:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      app_edge:
        ipv4_address: 172.29.0.3
      proxy_net:
        ipv4_address: 172.28.0.12

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["direct-https"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      # Optional for backward compatibility. When set, Caddy serves the same
      # backend on the public landing hostname as well as the app hostname.
      LANDING_DOMAIN: ${LANDING_DOMAIN:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${APP_DOMAIN:?APP_DOMAIN is required}"
        LANDING_CANONICAL="$${LANDING_DOMAIN#www.}"
        if [ -n "$${LANDING_CANONICAL}" ] && [ "$${LANDING_CANONICAL}" != "$${APP_DOMAIN}" ]; then
            SITE_ADDRESSES="$${APP_DOMAIN}, $${LANDING_CANONICAL}, www.$${LANDING_CANONICAL}"
        else
            SITE_ADDRESSES="$${APP_DOMAIN}"
        fi
        cat > /etc/caddy/Caddyfile <<EOF
        $${SITE_ADDRESSES} {
            encode zstd gzip

            header {
                Strict-Transport-Security "max-age=31536000; includeSubDomains"
                X-Content-Type-Options "nosniff"
                Referrer-Policy "strict-origin-when-cross-origin"
            }

            reverse_proxy edge:8080
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      edge:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy_net:
        ipv4_address: 172.28.0.10

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["cloudflare"]
    environment:
      # Keep the tunnel secret out of command arguments and process listings.
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      edge:
        condition: service_healthy
    networks:
      proxy_net:
        ipv4_address: 172.28.0.11

  worker:
    <<: *backend-image
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    command: /app/worker-entrypoint.sh

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  bot_polling_lock:
    # The explicit name makes the lock shared by bot containers started from
    # different Compose projects on the same Docker host.
    name: fitminiapp_bot_polling_lock

networks:
  app_edge:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  proxy_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
