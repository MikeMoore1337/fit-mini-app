services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: 172.28.0.10,172.28.0.11
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)\"",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
    networks:
      - default
      - proxy_net

  setup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: /app/setup-entrypoint.sh

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://app.your-fitness-coach.ru}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN}
      BOT_POLLING_ENABLED: ${BOT_POLLING_ENABLED:-true}
      BOT_POLLING_LOCK_DIR: /var/lock/fitminiapp-bot
      BOT_CONFLICT_RETRY_SECONDS: ${BOT_CONFLICT_RETRY_SECONDS:-300}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - bot_polling_lock:/var/lock/fitminiapp-bot

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["direct-https"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${APP_DOMAIN:?APP_DOMAIN is required}"
        cat > /etc/caddy/Caddyfile <<EOF
        $${APP_DOMAIN} {
            encode zstd gzip

            header {
                Strict-Transport-Security "max-age=31536000; includeSubDomains"
                X-Content-Type-Options "nosniff"
                Referrer-Policy "strict-origin-when-cross-origin"
            }

            reverse_proxy backend:8000
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy_net:
        ipv4_address: 172.28.0.10

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["cloudflare"]
    environment:
      # Keep the tunnel secret out of command arguments and process listings.
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      backend:
        condition: service_healthy
    networks:
      proxy_net:
        ipv4_address: 172.28.0.11

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    command: /app/worker-entrypoint.sh

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  bot_polling_lock:
    # The explicit name makes the lock shared by bot containers started from
    # different Compose projects on the same Docker host.
    name: fitminiapp_bot_polling_lock

networks:
  proxy_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
