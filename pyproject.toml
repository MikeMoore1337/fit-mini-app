[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-mini-app"
version = "0.1.0"
description = "Telegram Mini App для тренировок: FastAPI, мини-приложение, бот"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "pre-commit>=4.6",
    "ruff>=0.16.1",
    "mypy>=2.3",
]

# Ruff запускается по backend/app, bot/app, tests и scripts.
# Mypy пока проверяет backend/app: backend и bot оба используют пакет app, поэтому их типизацию
# лучше разводить отдельной настройкой, когда будем ужесточать проверки бота.

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend", "bot", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "SIM108",
    "RUF001",
    "RUF002",
    "RUF003",
    # FastAPI: Depends() в аргументах по умолчанию — нормальный паттерн.
    "B008",
    # HTTPException из except — без цепочки исключений, типично для API.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = false
mypy_path = "backend"
explicit_package_bases = true
packages = ["app"]
exclude = ["^backend/alembic/"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false

[tool.pytest.ini_options]
cache_dir = ".tmp_pytest_cache"
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.extension",
]

[[tool.mypy.overrides]]
module = ["alembic", "alembic.*"]
ignore_errors = true

# pydantic-settings: значения приходят из env при рантайме.
[[tool.mypy.overrides]]
module = ["app.core.config"]
disable_error_code = ["call-arg"]
